<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page Not Found</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            perspective: 1000px;
        }

        .hold-err {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            animation: float-up 3s ease-in-out infinite;
        }

        @keyframes float-up {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .number {
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 
                0 5px 0 #005713,
                0 10px 0 #004010,
                0 15px 0 #003008,
                0 20px 30px rgba(0, 0, 0, 0.5),
                0 30px 50px rgba(0, 0, 0, 0.3);
            transform: rotateX(10deg);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: rotateX(10deg) scale(1); }
            50% { transform: rotateX(10deg) scale(1.05); }
        }

        /* 3D Eye Container */
        .hold-eye {
            width: clamp(150px, 20vw, 250px);
            height: clamp(80px, 10vw, 130px);
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: 5px solid #005713;
            border-radius: 50%;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 30px;
            box-shadow: 
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.4),
                0 20px 50px rgba(0, 0, 0, 0.2);
            transform: rotateX(10deg);
            animation: blink 4s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { 
                height: clamp(80px, 10vw, 130px);
                border-radius: 50%;
            }
            95% { 
                height: 10px;
                border-radius: 50% / 10%;
            }
        }

        /* 3D Eyeballs */
        .eye {
            width: clamp(25px, 3vw, 40px);
            height: clamp(25px, 3vw, 40px);
            background: radial-gradient(circle at 30% 30%, #fff, #f0f0f0);
            border-radius: 50%;
            position: relative;
            box-shadow: 
                inset 0 -3px 8px rgba(0, 0, 0, 0.3),
                0 5px 15px rgba(0, 0, 0, 0.4);
            animation: eye-move 3s ease-in-out infinite;
        }

        /* Iris */
        .eye::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 35% 35%, #4a90e2, #2c5aa0);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                inset 0 -2px 5px rgba(0, 0, 0, 0.5),
                0 2px 5px rgba(0, 0, 0, 0.3);
            animation: iris-move 3s ease-in-out infinite;
        }

        /* Pupil */
        .eye::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle at 30% 30%, #333, #000);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                inset 0 -1px 3px rgba(255, 255, 255, 0.3),
                0 1px 3px rgba(0, 0, 0, 0.8);
            animation: pupil-move 3s ease-in-out infinite;
        }

        @keyframes eye-move {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes iris-move {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(-60%, -50%); }
            75% { transform: translate(-40%, -50%); }
        }

        @keyframes pupil-move {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(-65%, -50%); }
            75% { transform: translate(-35%, -50%); }
        }

        /* Error Message */
        .hold-err2 {
            position: relative;
            z-index: 1;
            color: #fff;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: bold;
            text-shadow: 
                0 3px 0 #005713,
                0 6px 0 #004010,
                0 9px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            animation: fade-in 1s ease-in;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hold-err2 p {
            margin-bottom: 20px;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
        }

        /* 3D Button */
        .back-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(145deg, #00aa44, #005713);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: bold;
            box-shadow: 
                0 8px 0 #003d0f,
                0 12px 20px rgba(0, 0, 0, 0.4),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .back-btn:hover::before {
            left: 100%;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 11px 0 #003d0f,
                0 15px 25px rgba(0, 0, 0, 0.5),
                inset 0 2px 5px rgba(255, 255, 255, 0.4);
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: 
                0 4px 0 #003d0f,
                0 6px 10px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hold-err {
                gap: 10px;
            }
            
            .hold-eye {
                padding: 0 15px;
            }
        }

        /* Floating shapes in background */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float-shapes 15s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            left: 80%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 40%;
            left: 5%;
            animation-delay: 4s;
        }

        @keyframes float-shapes {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    
    <div class="container">
        <div class="hold-err">
            <span class="number">4</span>
            <span class="hold-eye">
                <span class="eye"></span>
                <span class="eye"></span>
            </span>
            <span class="number">4</span>
        </div>
        
        <div class="hold-err2">
            <p>Oops! Page Not Found</p>
            <a href="/" class="back-btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
