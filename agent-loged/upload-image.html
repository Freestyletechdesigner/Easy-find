<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/logo/logo.JPEG">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Upload Profile Picture</title>
</head>
<body>

<style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffffff 0%, #07534d 100%);
      margin: 0;
      padding: clamp(16px, 4vw, 40px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      padding: clamp(20px, 4vw, 40px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: clamp(24px, 4vw, 32px);
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: clamp(14px, 2.5vw, 16px);
    }

    /* Profile Picture Preview */
    .profile-preview {
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #00493f;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    .profile-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-preview .camera-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s;
    }

    .profile-preview .camera-overlay:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .profile-preview .camera-overlay i {
      font-size: 24px;
    }

    /* Drop zone */
    .drop-zone {
      border: 3px dashed #27b3cc;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
      background: #f8f9ff;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: #4ba28f;
      background: #f0f2ff;
      transform: scale(1.02);
    }

    .drop-zone i {
      font-size: 48px;
      color: #1af0ba;
      margin-bottom: 15px;
    }

    .drop-zone p {
      color: #666;
      margin: 5px 0;
    }

    .drop-zone .file-info {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 15px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn.upload {
      background: linear-gradient(135deg, #66eadf 0%, #097465 100%);
      color: #fff;
    }

    .btn.upload:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn.delete {
      background: #ff4757;
      color: #fff;
    }

    .btn.delete:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
    }

    .btn.skip {
      background: #f1f3f5;
      color: #666;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn.skip:hover {
      background: #e9ecef;
      transform: translateY(-2px);
    }

    /* Alert */
    .alert {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert i {
      font-size: 20px;
    }

    /* Loading spinner */
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .actions {
        flex-direction: column;
      }

      .profile-preview {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-user-circle"></i> Profile Picture</h1>
      <p>Upload your profile picture to personalize your account</p>
    </div>

    <div class="alert" id="alert">
      <i class="fas fa-check-circle"></i>
      <span id="alert-message"></span>
    </div>

    <!-- Profile Picture Preview -->
    <div class="profile-preview">
      <img src="profile.png" id="preview" alt="Profile Picture">
      <label class="camera-overlay" for="fileInput">
        <i class="fas fa-camera"></i>
      </label>
    </div>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone">
      <i class="fas fa-cloud-upload-alt"></i>
      <p><strong>Click to upload</strong> or drag and drop</p>
      <p class="file-info">JPEG, PNG, GIF, WebP (Max 5MB)</p>
    </div>

    <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" hidden>

    <!-- Actions -->
    <div class="actions">
      <button class="btn upload" id="uploadBtn" disabled>
        <i class="fas fa-upload"></i>
        Upload Picture
      </button>
      <button class="btn delete" id="deleteBtn">
        <i class="fas fa-trash"></i>
        Delete
      </button>
    </div>

    <div class="actions" style="margin-top: 10px;">
      <a href="/agent-loged" class="btn skip">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const uploadBtn = document.getElementById('uploadBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const alert = document.getElementById('alert');
    const alertMessage = document.getElementById('alert-message');

    let selectedFile = null;

    // Load existing profile picture
    async function loadProfilePicture() {
      try {
        const response = await fetch('/api/agent/profile/picture');
        
        if (response.ok) {
          const data = await response.json();
          if (data.success && data.profilePicture) {
            preview.src = data.profilePicture;
          }
        } else if (response.status === 403) {
          // Not authenticated, redirect to login
          window.location.href = '/login-agent.html';
        }
      } catch (error) {
        console.error('Error loading profile picture:', error);
      }
    }

    loadProfilePicture();

    // Show alert
    function showAlert(message, type) {
      alertMessage.textContent = message;
      alert.className = `alert ${type}`;
      alert.style.display = 'flex';
      
      setTimeout(() => {
        alert.style.display = 'none';
      }, 5000);
    }

    // Handle file selection
    function handleFile(file) {
      if (!file) return;

      // Validate file type
      const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
      if (!validTypes.includes(file.type)) {
        showAlert('Please select a valid image file (JPEG, PNG, GIF, WebP)', 'error');
        return;
      }

      // Validate file size (5MB)
      if (file.size > 5 * 1024 * 1024) {
        showAlert('File size must be less than 5MB', 'error');
        return;
      }

      selectedFile = file;
      
      // Preview image
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
      };
      reader.readAsDataURL(file);

      uploadBtn.disabled = false;
    }

    // Click to upload
    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    // File input change
    fileInput.addEventListener('change', (e) => {
      handleFile(e.target.files[0]);
    });

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      handleFile(e.dataTransfer.files[0]);
    });

    // Upload button
    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append('profilePicture', selectedFile);

      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<div class="spinner"></div> Uploading...';

      try {
        const response = await fetch('/api/agent/profile/picture', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Profile picture uploaded successfully!', 'success');
          selectedFile = null;
          uploadBtn.disabled = true;
          uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Picture';
          
          // Reload the profile picture
          loadProfilePicture();
        } else {
          showAlert(data.message || 'Upload failed', 'error');
          uploadBtn.disabled = false;
          uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Picture';
        }
      } catch (error) {
        showAlert('Error uploading file', 'error');
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Picture';
      }
    });

    // Delete button
    deleteBtn.addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete your profile picture?')) {
        return;
      }

      deleteBtn.disabled = true;
      deleteBtn.innerHTML = '<div class="spinner"></div> Deleting...';

      try {
        const response = await fetch('/api/agent/profile/picture', {
          method: 'DELETE'
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Profile picture deleted successfully!', 'success');
          preview.src = 'profile.png';
          selectedFile = null;
          uploadBtn.disabled = true;
        } else {
          showAlert(data.message || 'Delete failed', 'error');
        }
      } catch (error) {
        showAlert('Error deleting file', 'error');
      } finally {
        deleteBtn.disabled = false;
        deleteBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
      }
    });
  </script>
</body>
</html>
