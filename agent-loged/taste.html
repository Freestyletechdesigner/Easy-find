<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .btn-primary {
            background: #0284c7;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.4);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 1rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: #f8fafc;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: Georgia, serif;
            font-size: 1.25rem;
            font-weight: bold;
            color: #0f172a;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #94a3b8;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #e2e8f0;
            color: #475569;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row.three {
            grid-template-columns: repeat(3, 1fr);
        }

        /* Image Upload */
        .image-upload-zone {
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .image-upload-zone:hover {
            border-color: #0ea5e9;
            background: #f8fafc;
            transform: translateY(-2px);
        }

        .upload-input {
            display: none;
        }

        .upload-icon {
            font-size: 1.5rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }

        .image-upload-zone:hover .upload-icon {
            color: #0ea5e9;
        }

        .upload-text {
            font-size: 0.875rem;
            color: #6b7280;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }

        .upload-preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 0.5rem;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-preview {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .preview-item:hover .remove-preview {
            opacity: 1;
        }

        /* Feature Tags */
        .features-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .feature-tag {
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #e5e7eb;
            background: white;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .feature-tag:hover {
            border-color: #0ea5e9;
        }

        .feature-tag.selected {
            background: #f0f9ff;
            border-color: #0ea5e9;
            color: #0369a1;
        }

        /* Modal Footer */
        .modal-footer {
            background: #f8fafc;
            padding: 1rem 1.5rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        .btn-primary {
            background: #0284c7;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: #0369a1;
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            background: #0f172a;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            display: none;
            align-items: center;
            gap: 0.75rem;
            z-index: 200;
            animation: toastSlide 0.3s ease;
        }

        .toast.show {
            display: flex;
        }

        @keyframes toastSlide {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }

        .toast-content h4 {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.125rem;
        }

        .toast-content p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .properties-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .user-info {
                display: none;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .filters-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                max-width: none;
            }
            
            .properties-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row,
            .form-row.three {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button class="btn-primary" onclick="openModal()">
        <span>+</span>
        <span>Add New Property</span>
    </button>
    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">List New Property</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <form id="propertyForm">
                    <!-- Image Upload -->
                    <div class="form-group">
                        <label>Property Images</label>
                        <div class="upload-preview" id="imagePreviewContainer"></div>
                        <div class="image-upload-zone" onclick="document.getElementById('fileInput').click()">
                            <input type="file" id="fileInput" class="upload-input" accept="image/*" multiple onchange="handleImageUpload(this)">
                            <div class="upload-icon">☁</div>
                            <div class="upload-text">Click to upload images</div>
                            <div class="upload-hint">PNG, JPG, GIF up to 5MB</div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Property Title *</label>
                            <input type="text" name="title" required placeholder="e.g., Modern Loft in Downtown">
                        </div>
                        <div class="form-group">
                            <label>Price ($) *</label>
                            <input type="number" name="price" required min="0" placeholder="500000">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Property Type</label>
                            <select name="type">
                                <option value="house">House</option>
                                <option value="apartment">Apartment</option>
                                <option value="villa">Villa</option>
                                <option value="commercial">Commercial</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Location *</label>
                            <input type="text" name="location" required placeholder="City, State">
                        </div>
                    </div>

                    <div class="form-row three">
                        <div class="form-group">
                            <label>Bedrooms</label>
                            <input type="number" name="beds" min="0" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Bathrooms</label>
                            <input type="number" name="baths" min="0" step="0.5" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Area (sqft)</label>
                            <input type="number" name="area" min="0" placeholder="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" rows="3" placeholder="Describe the unique features of this property..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Features (Select all that apply)</label>
                        <div class="features-container" id="featuresContainer"></div>
                        <input type="hidden" name="features" id="featuresInput">
                    </div>
                </form>
            </div>
<script>
        // Modal
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
            resetForm();
        }
</script>            
</body>
</html>
