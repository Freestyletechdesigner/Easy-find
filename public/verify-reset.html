<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code – Easy Find</title>
    <link rel="icon" type="image/x-icon" href="/logo/logo.JPEG">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #66eaea 0%, #08634f 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .container {
            background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden; max-width: 900px; width: 100%;
            display: grid; grid-template-columns: 1fr 1.2fr;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .left {
            background: linear-gradient(135deg, #005f66 0%, #00443e 100%);
            padding: 60px 40px; color: white;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        .left .icon-wrap {
            width: 90px; height: 90px;
            background: rgba(255,255,255,0.15); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin-bottom: 24px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
            50%      { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(255,255,255,0); }
        }
        .left h1 { font-size: 28px; margin-bottom: 14px; }
        .left p  { font-size: 15px; line-height: 1.7; opacity: 0.88; margin-bottom: 28px; }
        .left ul { list-style: none; text-align: left; width: 100%; }
        .left ul li { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; opacity: 0.9; }
        .left ul li i { color: #66eae3; }

        .right { padding: 60px 40px; display: flex; flex-direction: column; justify-content: center; }
        .header { text-align: center; margin-bottom: 28px; }
        .header h2 { font-size: 26px; color: #333; margin-bottom: 8px; }
        .header p  { color: #666; font-size: 14px; line-height: 1.6; }
        .phone-display {
            display: inline-block; margin-top: 10px;
            background: #e8fffe; color: #005f66;
            padding: 4px 14px; border-radius: 20px;
            font-weight: 700; font-size: 14px;
        }

        .otp-group { display: flex; justify-content: center; gap: 12px; margin: 24px 0; }
        .otp-input {
            width: 52px; height: 58px;
            border: 2px solid #e8ecf1; border-radius: 12px;
            font-size: 1.6rem; font-weight: 700; text-align: center;
            background: #f5f7fa; color: #005f66;
            transition: all 0.25s; outline: none;
        }
        .otp-input:focus { border-color: #005f66; background: white; box-shadow: 0 0 0 4px rgba(0,95,102,0.12); transform: translateY(-2px); }
        .otp-input.filled { border-color: #00a896; background: #e8fffe; }
        .otp-input.error  { border-color: #f5576c; background: #fff5f5; animation: shake 0.4s ease; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-6px); }
            75%     { transform: translateX(6px); }
        }

        .timer-wrap { text-align: center; margin-bottom: 20px; font-size: 14px; color: #888; }
        .timer-wrap #countdown { font-weight: 700; color: #005f66; font-size: 16px; }
        .timer-wrap #countdown.expired { color: #f5576c; }

        .btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #005f66 0%, #00443e 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 5px 20px rgba(0,95,102,0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,95,102,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-resend {
            width: 100%; margin-top: 12px; padding: 13px;
            background: transparent; color: #005f66;
            border: 2px solid #005f66; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .btn-resend:hover:not(:disabled) { background: #e8fffe; }
        .btn-resend:disabled { opacity: 0.4; cursor: not-allowed; }

        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: none; }
        .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .alert.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.4); border-top-color: white;
            border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link { text-align: center; margin-top: 22px; font-size: 14px; color: #888; }
        .back-link a { color: #005f66; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .back-link a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .left  { padding: 40px 30px; }
            .right { padding: 40px 24px; }
            .otp-input { width: 44px; height: 50px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left">
        <div class="icon-wrap"><i class="fas fa-mobile-alt"></i></div>
        <h1>Check Your Phone</h1>
        <p>Enter the 6-digit code we sent to your phone number to continue resetting your password.</p>
        <ul>
            <li><i class="fas fa-clock"></i> Code expires in 10 minutes</li>
            <li><i class="fas fa-shield-alt"></i> Never share your code</li>
            <li><i class="fas fa-redo"></i> Request a new code if needed</li>
        </ul>
    </div>

    <div class="right">
        <div class="header">
            <h2>Enter Verification Code</h2>
            <p>A 6-digit code was sent to</p>
            <span class="phone-display" id="phoneDisplay">your phone</span>
        </div>

        <div id="alert" class="alert"></div>

        <div class="otp-group" id="otpGroup">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
        </div>

        <div class="timer-wrap">Code expires in <span id="countdown">10:00</span></div>

        <button class="btn" id="verifyBtn" onclick="verifyCode()">
            <span class="spinner" id="spinner"></span>
            <span id="btnText"><i class="fas fa-check-circle"></i> Verify Code</span>
        </button>

        <button class="btn-resend" id="resendBtn" disabled onclick="resendCode()">
            <i class="fas fa-redo"></i> Resend Code
        </button>

        <div class="back-link">
            <a href="/forgot-password.html"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const phone  = params.get('phone') || sessionStorage.getItem('resetPhone') || '';
    const masked = phone ? phone.slice(0,4) + '****' + phone.slice(-3) : 'your phone';
    document.getElementById('phoneDisplay').textContent = masked;

    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, i) => {
        input.addEventListener('input', e => {
            const val = e.target.value.replace(/\D/g, '');
            e.target.value = val;
            if (val) { e.target.classList.add('filled'); if (i < 5) inputs[i+1].focus(); }
            else e.target.classList.remove('filled');
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !input.value && i > 0) {
                inputs[i-1].focus(); inputs[i-1].value = ''; inputs[i-1].classList.remove('filled');
            }
        });
        input.addEventListener('paste', e => {
            e.preventDefault();
            const pasted = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
            pasted.split('').forEach((c, idx) => { if (inputs[idx]) { inputs[idx].value = c; inputs[idx].classList.add('filled'); } });
            inputs[Math.min(pasted.length, 5)].focus();
        });
    });
    inputs[0].focus();

    let timeLeft = 600;
    const cd = document.getElementById('countdown');
    const timer = setInterval(() => {
        timeLeft--;
        const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
        const s = String(timeLeft%60).padStart(2,'0');
        cd.textContent = `${m}:${s}`;
        if (timeLeft <= 60) cd.style.color = '#f5576c';
        if (timeLeft <= 0) { clearInterval(timer); cd.textContent = 'Expired'; cd.classList.add('expired'); document.getElementById('resendBtn').disabled = false; }
    }, 1000);
    setTimeout(() => { document.getElementById('resendBtn').disabled = false; }, 30000);

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg; el.className = `alert ${type}`;
        setTimeout(() => el.className = 'alert', 4000);
    }

    async function verifyCode() {
        const otp = Array.from(inputs).map(i => i.value).join('');
        if (otp.length < 6) {
            inputs.forEach(i => i.classList.add('error'));
            setTimeout(() => inputs.forEach(i => i.classList.remove('error')), 600);
            showAlert('Please enter the complete 6-digit code', 'error'); return;
        }
        const btn = document.getElementById('verifyBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        btn.disabled = true; spinner.style.display = 'inline-block'; btnText.style.display = 'none';

        try {
            const res  = await fetch('/api/agent/verify-otp', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ otp })
            });
            const data = await res.json();
            if (data.success) {
                showAlert('Verified! Redirecting...', 'success');
                sessionStorage.setItem('resetPhone', phone);
                setTimeout(() => window.location.href = '/reset-password.html', 1200);
            } else {
                showAlert(data.message || 'Invalid code', 'error');
                inputs.forEach(i => { i.classList.add('error'); i.value = ''; i.classList.remove('filled'); });
                setTimeout(() => inputs.forEach(i => i.classList.remove('error')), 600);
                inputs[0].focus();
                btn.disabled = false; spinner.style.display = 'none'; btnText.style.display = 'inline';
            }
        } catch { showAlert('Something went wrong.', 'error'); btn.disabled = false; spinner.style.display = 'none'; btnText.style.display = 'inline'; }
    }

    async function resendCode() {
        if (!phone) { showAlert('Phone not found. Go back.', 'error'); return; }
        document.getElementById('resendBtn').disabled = true;
        try {
            const res  = await fetch('/api/agent/send-code', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number: phone })
            });
            const data = await res.json();
            if (data.success) {
                showAlert('New code sent!', 'success');
                timeLeft = 600; cd.style.color = ''; cd.classList.remove('expired');
                inputs.forEach(i => { i.value = ''; i.classList.remove('filled','error'); });
                inputs[0].focus();
                setTimeout(() => { document.getElementById('resendBtn').disabled = false; }, 30000);
            } else { showAlert(data.message || 'Failed to resend', 'error'); document.getElementById('resendBtn').disabled = false; }
        } catch { showAlert('Something went wrong.', 'error'); document.getElementById('resendBtn').disabled = false; }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') verifyCode(); });
</script>
</body>
</html>
