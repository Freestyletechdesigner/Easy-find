
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EasyFind AI - Best AI For Finding Property</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #103e3c; /* Deep teal from image */
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 25px 25px;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- TOP NAVBAR --- */
    .top-bar {
      height: 65px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      flex-shrink: 0;
      border-radius: 0 0 15px 15px;
      margin: 5px 5px 0 5px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .logo-box{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;font-size:14px;
    background:linear-gradient(135deg,#0d7068,#055361);
    color:#fff;font-weight:700;box-shadow:0 6px 14px rgba(13,112,104,.3)
    }


    .brand-name {
      font-weight: 700;
      font-size: 14px;
      color: #000;
      letter-spacing: -0.5px;
    }

    /* --- HERO CONTAINER --- */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 16px;
      transition: opacity 0.3s ease;
    }

    /* --- DETAILED AI ROBOT MASCOT (Restored) --- */
    .search-agent-container {
      position: relative;
      width: 70px;
      height: 75px;
      transform: scale(1.1); /* Slightly larger for better visibility */
      margin-bottom: 10px;
    }

    .agent-body {
      position: absolute;
      bottom: 12px;
      left: 20px;
      width: 30px;
      height: 27px;
      background: #8df7ff; /* Cyan body from image accent */
      border-radius: 12px 12px 9px 9px;
      box-shadow: 0 5px 12px rgba(141, 247, 255, 0.3);
    }

    .agent-head {
      position: absolute;
      top: 11px;
      left: 16px;
      width: 38px;
      height: 31px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transform-origin: bottom center;
      animation: humanHeadMove 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .agent-visor {
      width: 28px;
      height: 16px;
      background: #103e3c; /* Visor matches deep teal */
      border-radius: 7px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 4px;
    }

    .agent-eye {
      width: 5px;
      height: 5px;
      background-color: #8df7ff;
      border-radius: 50%;
      box-shadow: 0 0 5px #8df7ff;
      animation: naturalBlink 3.5s infinite;
    }

    .agent-arm-left {
      position: absolute;
      left: 11px;
      top: 40px;
      width: 8px;
      height: 16px;
      background: #ffffff;
      border-radius: 4px;
      transform-origin: top center;
      animation: gentleBalance 2.5s ease-in-out infinite alternate;
    }

    .agent-arm-right-container {
      position: absolute;
      right: -3px;
      top: 38px;
      width: 22px;
      height: 30px;
      transform-origin: 5px 5px;
      animation: humanArmScan 4s ease-in-out infinite;
      z-index: 10;
    }

    .agent-arm-right {
      width: 8px;
      height: 15px;
      background: #ffffff;
      border-radius: 4px;
      transform: rotate(-25deg);
    }

    .agent-hand-grip {
      position: absolute;
      left: 4px;
      top: 11px;
      width: 9px;
      height: 9px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .agent-magnifying-glass {
      position: absolute;
      bottom: 4px;
      left: -2px;
      width: 13px;
      height: 13px;
      border: 2px solid #8df7ff;
      border-radius: 50%;
      background: rgba(141, 247, 255, 0.1);
      box-shadow: 0 0 6px rgba(141, 247, 255, 0.4);
    }

    .agent-magnifying-glass::after {
      content: '';
      position: absolute;
      top: 12px;
      left: 5px;
      width: 2px;
      height: 11px;
      background-color: #8df7ff;
      border-radius: 1px;
    }

    /* --- HERO TEXT AND TYPING --- */
    .hero-title {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .typing-container {
      font-size: 16px;
      color: #8df7ff;
      font-weight: 500;
      min-height: 24px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      background-color: #8df7ff;
      margin-left: 3px;
      animation: blink 0.7s infinite;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #e0f2f1;
      max-width: 350px;
      line-height: 1.5;
      opacity: 0.8;
    }

    /* --- CHAT FEED --- */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .messages-wrapper {
      width: 100%;
      max-width: 768px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-row { display: flex; gap: 12px; width: 100%; }
    .chat-row.user { justify-content: flex-end; }

    .message-content {
      max-width: 85%;
      font-size: 15px;
      line-height: 1.6;
      border-radius: 18px;
      padding: 12px 18px;
    }

    .chat-row.bot .message-content {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .chat-row.user .message-content {
      background-color: #8df7ff;
      color: #103e3c;
      font-weight: 500;
    }

    /* --- INPUT AREA --- */
    .input-container {
      padding: 10px 16px 20px 16px;
      background: linear-gradient(180deg, transparent 0%, #103e3c 100%);
    }

    .input-box {
      width: 100%;
      max-width: 768px;
      height: 50px;
      background-color: #ffffff;
      border-radius: 28px;
      padding: 8px 12px 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #103e3c;
      font-size: 15px;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background-color: #8df7ff;
      color: #103e3c;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-btn-icon { color: #103e3c; font-size: 18px; cursor: pointer; background: none; border: none;}

    /* --- ANIMATIONS --- */
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    @keyframes humanHeadMove {
      0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
      20% { transform: translateY(1px) rotateX(8deg) rotateY(-10deg); }
      40% { transform: translateY(-0.5px) rotateX(-4deg) rotateY(12deg); }
      65% { transform: translateY(0.5px) rotateX(6deg) rotateY(8deg); }
      85% { transform: translateY(-1px) rotateX(-6deg) rotateY(-6deg); }
    }

    @keyframes humanArmScan {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30% { transform: rotate(-18deg) translateX(-1.5px) translateY(-1px); }
      70% { transform: rotate(12deg) translateX(1px) translateY(2px); }
    }

    @keyframes gentleBalance {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg) translateY(-0.5px); }
    }

    @keyframes naturalBlink {
      0%, 88%, 94%, 100% { transform: scaleY(1); }
      91%, 97% { transform: scaleY(0.1); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-section">
      <div class="logo-box">E</div>
      <span class="brand-name">asy Find</span>
    </div>
    <button class="action-btn-icon"><i class="fa-solid fa-bars"></i></button>
  </div>

  <!-- Hero Section -->
  <div class="hero-container" id="heroContainer">
    <!-- Restored Detailed Robot Icon -->
    <div class="search-agent-container">
      <div class="agent-body"></div>
      <div class="agent-head">
        <div class="agent-visor">
          <div class="agent-eye"></div>
          <div class="agent-eye"></div>
        </div>
      </div>
      <div class="agent-arm-left"></div>
      <div class="agent-arm-right-container">
        <div class="agent-arm-right"></div>
        <div class="agent-hand-grip">
          <div class="agent-magnifying-glass"></div>
        </div>
      </div>
    </div>
    
    <h1 class="hero-title">Find your next home<br> with ease</h1>
    
    <div class="typing-container">
      <span id="typing-text"></span><span class="cursor"></span>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chatContainer">
    <div class="messages-wrapper" id="messagesWrapper"></div>
  </div>

  <!-- Input Bar -->
  <div class="input-container">
    <div class="input-box">
      <button class="action-btn-icon"><i class="fa-solid fa-paperclip"></i></button>
      <input type="text" id="userInput" placeholder="Ask EasyFind AI anything..." oninput="toggleButtons()" onkeypress="handleKeyPress(event)" />
      <button class="action-btn-icon" id="micBtn"><i class="fa-solid fa-microphone"></i></button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // --- TYPING EFFECT ---
    const typingText = document.getElementById('typing-text');
    const searchQueries = [
      "Searching for 3 bedroom flat in Agbani Road...",
      "Finding luxury villas with swimming pools...",
      "Looking for affordable duplexes in Enugu...",
      "Searching for modern office spaces in Enugu...",
      "Finding properties under 150k Naira..."
    ];

    let queryIndex = 0; let charIndex = 0; let isDeleting = false; let typeSpeed = 100;

    function typeEffect() {
      const currentQuery = searchQueries[queryIndex];
      if (isDeleting) {
        typingText.textContent = currentQuery.substring(0, charIndex - 1);
        charIndex--; typeSpeed = 50;
      } else {
        typingText.textContent = currentQuery.substring(0, charIndex + 1);
        charIndex++; typeSpeed = 100;
      }

      if (!isDeleting && charIndex === currentQuery.length) {
        isDeleting = true; typeSpeed = 2000;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false; queryIndex = (queryIndex + 1) % searchQueries.length; typeSpeed = 500;
      }
      setTimeout(typeEffect, typeSpeed);
    }
    window.onload = typeEffect;

    // --- CHAT LOGIC ---
    const heroContainer = document.getElementById('heroContainer');
    const chatContainer = document.getElementById('chatContainer');
    const messagesWrapper = document.getElementById('messagesWrapper');
    const userInput = document.getElementById('userInput');
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');

    let isFirstMessage = true;

    function toggleButtons() {
      if (userInput.value.trim().length > 0) {
        micBtn.style.display = 'none'; sendBtn.style.display = 'flex';
      } else {
        micBtn.style.display = 'flex'; sendBtn.style.display = 'none';
      }
    }

    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      if (isFirstMessage) { heroContainer.style.display = 'none'; chatContainer.style.display = 'flex'; isFirstMessage = false; }

      const userRow = document.createElement('div');
      userRow.className = 'chat-row user';
      userRow.innerHTML = `<div class="message-content">${text}</div>`;
      messagesWrapper.appendChild(userRow);

      userInput.value = ''; toggleButtons();
      chatContainer.scrollTop = chatContainer.scrollHeight;

      setTimeout(() => {
        const botRow = document.createElement('div');
        botRow.className = 'chat-row bot';
        botRow.innerHTML = `<div class="message-content">I'm scanning the market for: "${text}"...</div>`;
        messagesWrapper.appendChild(botRow);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 800);
    }
    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
  </script>
</body>
</html>
