        <section class="section-drop">

            <form enctype="multipart/form-data" class="upload-form">
                <div class="hero-upload">
                    <h3>Hero Image</h3>

                    <div class="drop-zone">
                        <img src="placeholder.jpg" alt="">
                        <span class="drop-text">Tap or drag image here</span>
                    </div>

                    <input type="file" name="file" accept="image/*" hidden>

                    <button type="submit" class="save-btn">Save</button>
                    <button type="button" class="cancel-btn">Cancel</button>
                </div>
            </form>

            <form enctype="multipart/form-data" class="upload-form">
                <div class="hero-upload">
                    <h3>Property Uploader</h3>

                    <div class="drop-zone">
                        <img src="" alt="">
                        <span class="drop-text">Tap or drag files here</span>
                    </div>

                    <input class="folder-name" type="text" name="folder" placeholder="Enter folder name" required>
                    <input type="file" name="files" multiple hidden>

                    <button type="submit" class="save-btn">Save</button>
                    <button type="button" class="cancel-btn">Cancel</button>
                </div>
            </form>

        </section>
